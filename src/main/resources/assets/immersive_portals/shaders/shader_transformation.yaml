---
configs:
  - comment: For vanilla terrain rendering
    type: vs
    affectedShaders:
      - terrain
      - rendertype_solid
      - rendertype_cutout
      - rendertype_cutout_mipped
      - rendertype_translucent
      - rendertype_tripwire
    transformations:
      - pattern: |-
          void ( )*main( )*\(( )*( )*\)( )*(
          )*\{
        replacement: |-
          uniform vec4 iportal_ClippingEquation;
          void main() {
              gl_ClipDistance[0] = dot(Position.xyz + ModelOffset, iportal_ClippingEquation.xyz) +
                  iportal_ClippingEquation.w;
    debugOutput: false
  - comment: For entity rendering and particle
    type: vs
    affectedShaders:
      - entity
      - rendertype_armor_cutout_no_cull
      - rendertype_armor_translucent
      - rendertype_breeze_wind
      - rendertype_crumbling
      - rendertype_energy_swirl
      - rendertype_entity_alpha
      - rendertype_entity_solid
      - rendertype_entity_cutout
      - rendertype_entity_cutout_no_cull
      - rendertype_entity_cutout_no_cull_z_offset
      - rendertype_entity_decal
      - rendertype_entity_no_outline
      - rendertype_entity_shadow
      - rendertype_item_entity_translucent_cull
      - rendertype_entity_translucent_cull
      - rendertype_entity_translucent
      - rendertype_entity_smooth_cutout
      - rendertype_beacon_beam
      - rendertype_entity_translucent_emissive
      - rendertype_entity_translucent_cull
      - rendertype_leash
      - particle
    transformations:
      - pattern: |-
          void ( )*main( )*\(( )*( )*\)( )*(
          )*\{
        replacement: |-
          uniform vec4 iportal_ClippingEquation;
          void main() {
              gl_ClipDistance[0] = dot(
                  (ModelViewMat * vec4(Position, 1.0)).xyz,
                  iportal_ClippingEquation.xyz
              ) + iportal_ClippingEquation.w;
    debugOutput: false
  - comment: For portal area rendering
    type: vs
    affectedShaders:
      - portal_area
    transformations:
      - pattern: |-
          void ( )*main( )*\(( )*( )*\)( )*(
          )*\{
        replacement: |-
          uniform vec4 iportal_ClippingEquation;
          void main() {
              gl_ClipDistance[0] = dot(Position.xyz, iportal_ClippingEquation.xyz) +
                  iportal_ClippingEquation.w;
    debugOutput: false
  - comment: For iris+sodium
    type: vs
    affectedShaders:
      - iris_gbuffers_terrain
      - iris_gbuffers_water
    transformations:
      - pattern: |-
          void ( )*main( )*\(( )*( )*\)( )*(
          )*\{
        replacement: |-
          uniform vec4 iportal_ClippingEquation;
          void main() {
      - pattern: "\\}(?![\\S\\s]*\\})"
        # match the last } ([\S\s] matches any character). use the modelview-transformed coordinate
        replacement: |-
          gl_ClipDistance[0] = dot(
              (iris_ModelViewMatrix * getVertexPosition()).xyz, iportal_ClippingEquation.xyz
          ) + iportal_ClippingEquation.w;
          }
    debugOutput: false
  - comment: For sodium
    type: vs
    affectedShaders:
      - sodium:blocks/block_layer_opaque.vsh
    transformations:
      - pattern: |-
          void ( )*main( )*\(( )*( )*\)( )*(
          )*\{
        replacement:
          uniform vec4 iportal_ClippingEquation;
          void main() {
      - pattern: "\\}(?![\\S\\s]*\\})"
        # match the last } ([\S\s] matches any character). Sodium's position is already camera-relative.
        replacement: |-
          gl_ClipDistance[0] = dot(
              position, iportal_ClippingEquation.xyz
          ) + iportal_ClippingEquation.w;
          }
    debugOutput: false
